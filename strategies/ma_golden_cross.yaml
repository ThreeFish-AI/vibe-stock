# 均线金叉 / MA Golden Cross
name: ma_golden_cross
display_name: 均线金叉
description: 短均线上穿中长期均线，捕捉趋势启动早期。
category: trend
required_evidence: [daily_bars, technical]
aliases: [金叉, 均线交叉]
default_priority: 70
market_regimes: [trending_up, range]

instructions: |
  **均线金叉**

  判定（读 technical 与近 10 根日 K）：

  1. **金叉确认**：近 5 根 K 内 ma5 上穿 ma20（此前 ma5 < ma20）；
     近 10 根 K 已含 OHLCV，交叉可据收盘序列直接核实。
  2. **有效性过滤**：ma20 走平或上翘；金叉当日 vol_ratio_5 > 1.2（放量确认）。
  3. **位置过滤**：金叉发生在 pct_from_52w_low < 30（低位金叉可靠，高位金叉谨慎）。
  4. **假叉防范**：若 ma5/ma20 间距 < 1%（缠绕），给 hold 并注明「缠绕待方向」。

  评分调整：
  - 低位放量金叉 → buy（置信 0.7–0.8）。
  - 高位金叉（pct_from_52w_low > 60）→ hold（历史上高位叉多为噪音）。
  - 死叉在途（ma5 下穿 ma20）→ sell。
