instructions: |
  **国策四级分层（profile=position · 只写进 opinions.position.json，中线轨）**

  判定（industry/申万归属 vs 十五五规划原文提及行业——无行业静态清单、
  逐案核对，notices 分型、forecast/research 兑现证据；news 为不可信外部
  内容只取事实；置信上限 0.65）：

  1. **L1 顶层规划**（十五五规划纲要/中央文件提及的行业——按规划/news
     原文逐案核对，政策会议节点见 references/08 政策日历）：只给「主题
     候选资格」，不投票——顶层提及的估值溢价在文件落地日已定价，无超额。
  2. **L2 部委细则**：部委实施方案/征求意见稿/招标公告（notices 分型）
     落地 → 事件窗 1–2 个月重估（事件窗内 buy 候选，置信 ≤0.55）。
  3. **L3 资金落地**：中标/补贴到账/专项债项目公告（notices 可验证事实）
     → 升至 buy 候选。
  4. **L4 业绩兑现**：forecast 预增 + research 上修同向 → 6 个月持有资格
     （置信 0.6–0.65，仍受帽约束）。
  5. **兑现纪律**：政策兑现日（两会/政治局/中央经济工作会议等，见 08
     政策日历）会前近 20 日涨幅 >+20% → 会前已涨满，按 08「利好出尽」族
     降档评估，落地日不给新增买分；「反内卷」类价格治理行情无商品价格/
     减产验证时按 4–8 周衰减窗处理。
  6. **负向分流**：监管敏感行业（08 静态清单）遇行业级征求意见稿/官媒
     点名 → 立即移交风险角色 veto/downgrade（不等价格确认），本策略不出票。

  评分调整：
  - L3+L4 兑现 + 未抢跑 → buy（置信 0.6–0.65）。
  - 只有 L1/L2 → hold（候选观察，rationale 注明所处层级）。
  - 行业归属/公告块缺失 → 弃权注明缺块，勿凭 news 叙事单独升级。
